name: Deploy

on:
  push:
    branches: [main]
    # 运行时路径变更才部署：nightly 实踩——纯 scripts/tests/docs 提交也触发重建重启
    # （凌晨还会打断正在跑的评测）。git reset --hard 机制保证：被忽略的脚本改动会在
    # 下一次真实部署时随 origin/main 一并同步到服务器，不会永久漂移。
    paths-ignore:
      - 'scripts/**'
      - '.github/**'
      - 'tests/**'
      - 'docs/**'
      - 'data/evals/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy
  # 排队不取消：部署会 compose down/up 变更生产，中途取消会留下半新半旧镜像
  # （2026-09-07 实踩：构建被新 push 取消 → 容器混载新 pipeline + 旧 notify → nightly finalize AttributeError）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - name: Pull latest code
        run: |
          cd /home/runner/AnGIneer
          # 部署目录只跟随 origin/main：先 fetch 再硬对齐。
          # 服务器上若有残留的本地改动（如手动编辑 docker-compose.yml），
          # 直接丢弃（.env / data / .htpasswd 均为 untracked，不受影响）。
          echo "PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo '')" >> $GITHUB_ENV
          git fetch origin main
          git reset --hard origin/main
          # 注：popo 已于 2026-09-09 内化为普通目录，仓库不再有任何 submodule，
          # 无需 git submodule update。

      - name: Version consistency check
        run: |
          cd /home/runner/AnGIneer
          # 获取最新 git tag（发版 commit 才有 tag）
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No git tag found, skip version check."
            exit 0
          fi
          TAG_VER=${TAG#v}
          # 提取 README.md 版本
          README_VER=$(sed -n 's/.*当前版本：v\{0,1\}\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' README.md | head -1)
          # 提取 package.json 版本
          PKG_VER=$(node -e "console.log(require('./package.json').version)")
          echo "git tag:    $TAG_VER"
          echo "README.md:  $README_VER"
          echo "package.json: $PKG_VER"
          FAIL=0
          if [ "$README_VER" != "$TAG_VER" ]; then
            echo "ERROR: README.md version ($README_VER) != git tag ($TAG_VER)"
            FAIL=1
          fi
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: package.json version ($PKG_VER) != git tag ($TAG_VER)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Version mismatch! Run: node scripts/sync-version.mjs $TAG"
            exit 1
          fi
          echo "Version check passed."

      - name: Check .env exists
        run: |
          if [ ! -f /home/runner/AnGIneer/.env ]; then
            echo "ERROR: /home/runner/AnGIneer/.env not found"
            exit 1
          fi

      - name: Build images
        run: |
          cd /home/runner/AnGIneer/docker
          # 构建前清理：14 天前未使用的镜像（含旧 latest 版本）与全部 build cache，
          # 防止镜像/缓存无限累积（磁盘满会导致 runner 离线）
          docker image prune -a -f --filter "until=336h"
          docker builder prune -f
          docker compose build

      - name: Restart services
        run: |
          cd /home/runner/AnGIneer/docker
          bash deploy.sh --prepare
          docker compose down
          # 只拉起业务三件套；documentserver(onlyoffice) 已停用（无任何代码引用，
          # 3.6GB 机器上 pluginsmanager 持续 100% CPU），不再随部署自动复活
          docker compose up -d frontend docs-api aichat-api

      - name: Cleanup old images
        run: |
          docker image prune -f
          docker image prune -a -f --filter "until=336h"
          docker builder prune -f

      - name: Health check
        id: health
        run: |
          echo "Waiting for services..."
          sleep 10
          # -L 跟随 80→https 的 301（v0.2.29 起 80 端口只做 ACME+重定向，裸码恒为 301）
          FRONTEND=$(curl -sL -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
          ADMIN=$(curl -sL -o /dev/null -w "%{http_code}" http://localhost/admin/ || echo "000")
          API=$(curl -sL -o /dev/null -w "%{http_code}" http://localhost/docs || echo "000")
          if [ "$ADMIN" = "401" ]; then ADMIN="200(auth)"; fi
          echo "Frontend: $FRONTEND"
          echo "Admin: $ADMIN"
          echo "API docs: $API"
          cd /home/runner/AnGIneer/docker && docker compose ps
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT

      - name: Notify WeCom group
        if: always()
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_DEPLOY }}
          PREV_SHA: ${{ env.PREV_SHA }}
          FE: ${{ steps.health.outputs.frontend }}
          ADM: ${{ steps.health.outputs.admin }}
          API: ${{ steps.health.outputs.api }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 /home/runner/AnGIneer/.github/scripts/webhook_notify.py
