name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - name: Pull latest code
        run: |
          cd /home/runner/AnGIneer
          # 部署目录只跟随 origin/main：先 fetch 再硬对齐。
          # 服务器上若有残留的本地改动（如手动编辑 docker-compose.yml），
          # 直接丢弃（.env / data / .htpasswd 均为 untracked，不受影响）。
          echo "PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo '')" >> $GITHUB_ENV
          git fetch origin main
          git reset --hard origin/main

      - name: Check .env exists
        run: |
          if [ ! -f /home/runner/AnGIneer/.env ]; then
            echo "ERROR: /home/runner/AnGIneer/.env not found"
            exit 1
          fi

      - name: Build images
        run: |
          cd /home/runner/AnGIneer/docker
          docker compose build

      - name: Restart services
        run: |
          cd /home/runner/AnGIneer/docker
          bash deploy.sh --prepare
          docker compose down
          docker compose up -d

      - name: Cleanup old images
        run: docker image prune -f

      - name: Health check
        id: health
        run: |
          echo "Waiting for services..."
          sleep 10
          FRONTEND=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
          ADMIN=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/admin/ || echo "000")
          API=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/docs || echo "000")
          if [ "$ADMIN" = "401" ]; then ADMIN="200(auth)"; fi
          echo "Frontend: $FRONTEND"
          echo "Admin: $ADMIN"
          echo "API docs: $API"
          cd /home/runner/AnGIneer/docker && docker compose ps
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "admin=$ADMIN" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT

      - name: Notify WeCom group
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          PREV_SHA: ${{ env.PREV_SHA }}
          FE: ${{ steps.health.outputs.frontend }}
          ADM: ${{ steps.health.outputs.admin }}
          API: ${{ steps.health.outputs.api }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 /home/runner/AnGIneer/.github/scripts/webhook_notify.py
