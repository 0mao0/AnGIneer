name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, deploy]

    steps:
      - name: Pull latest code
        run: |
          cd /root/AnGIneer
          git pull origin main

      - name: Check .env exists
        run: |
          if [ ! -f /root/AnGIneer/.env ]; then
            echo "ERROR: /root/AnGIneer/.env not found"
            exit 1
          fi

      - name: Build images
        run: |
          cd /root/AnGIneer/docker
          docker compose build

      - name: Restart services
        run: |
          cd /root/AnGIneer/docker
          docker compose down
          docker compose up -d

      - name: Cleanup old images
        run: docker image prune -f

      - name: Health check
        run: |
          echo "Waiting for services..."
          sleep 10
          echo "Frontend:"; curl -s -o /dev/null -w "%{http_code}" http://localhost/ || true; echo ""
          echo "Admin:"; curl -s -o /dev/null -w "%{http_code}" http://localhost/admin/ || true; echo ""
          echo "API docs:"; curl -s -o /dev/null -w "%{http_code}" http://localhost/api/docs || true; echo ""
          cd /root/AnGIneer/docker && docker compose ps
