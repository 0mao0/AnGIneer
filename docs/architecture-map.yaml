version: 1
last_updated: 2026-08-13

truth_sources:
  - README.md
  - docs/retrieval-chain.md
  - docs/agent-harness.md
  - docs/parse-pipeline.md
  - docs/knowledge-data-model.md
  - docs/llm-gateway.md
  - AGENTS.md
  - package.json

readme_required_tokens:
  - apps/user-web
  - apps/admin-web
  - services/docs-api
  - services/aichat-api
  - packages/docs-ui
  - packages/aichat-ui
  - packages/ui-kit
  - services/ai-inference
  - services/tree-core
  - services/angineer-core
  - services/sop-core
  - services/docs-core
  - services/evals-core
  - services/geo-core
  - services/engtools
  - data/knowledge_base

system:
  name: AnGIneer
  repo_style: monorepo
  platforms:
    - user-web
    - admin-web
    - docs-api
    - aichat-api
  default_ports:
    user_web: 3005
    admin_web: 3002
    docs_api: 8790
    aichat_api: 8791
    embedding_service: 7997
    reranker_service: 7998

modules:
  - id: user-web
    path: apps/user-web
    role: user_workbench
    depends_on:
      - docs-ui
      - ui-kit
      - aichat-ui
      - docs-api
      - aichat-api
    key_symbols:
      - useResourceOpen
      - workbenchStore.openResource
      - Workbench

  - id: admin-web
    path: apps/admin-web
    role: admin_workspace
    depends_on:
      - docs-ui
      - ui-kit
      - aichat-ui
      - docs-api
      - aichat-api
    key_symbols:
      - KnowledgeManage
      - router-view

  - id: docs-api
    path: services/docs-api
    role: docs_gateway
    depends_on:
      - docs-core
      - angineer-core
      - tree-core
    key_symbols:
      - main.py
      - docs_routes.py
    exposes:
      - /api/knowledge/*
      - /api/graph/*
      - /api/v1/*
      - /api/api-keys/*

  - id: aichat-api
    path: services/aichat-api
    role: aichat_gateway
    depends_on:
      - angineer-core
      - ai-inference
      - docs-core
      - sop-core
      - evals-core
      - geo-core
      - engtools
      - tree-core
    key_symbols:
      - main.py
      - chat_agent.py
    exposes:
      - /api/chat/agent*
      - /api/llm_configs
      - /api/sops/*
      - /api/evals/*
      - /api/dream-cycle/*

  - id: docs-ui
    path: packages/docs-ui
    role: shared_ui_and_protocol
    depends_on: []
    key_symbols:
      - KnowledgeTree
      - SOPTree
      - createResourceNodeFromKnowledge
      - createOpenResourcePayload

  - id: aichat-ui
    path: packages/aichat-ui
    role: shared_chat_ui
    depends_on: []
    key_symbols:
      - AIChat
      - BaseChat
      - useAIChat

  - id: ui-kit
    path: packages/ui-kit
    role: shared_layout_and_theme
    depends_on: []
    key_symbols:
      - SmartTree
      - SplitPanes
      - useTheme

  - id: ai-inference
    path: services/ai-inference
    role: ai_inference_foundation
    depends_on: []
    key_symbols:
      - llm_client.py
      - llm_config.py
      - llm_response_parser.py
      - llm_logger.py
    description: >
      AI 推理底座，零外部依赖。提供 LLM 客户端（多模型/重试/熔断/流式）、响应解析。
      语义嵌入/语义重排统一走在线 API（DOCS_EMBEDDING_*、ANGINEER_RERANKER_URL）。
      所有上层服务直接依赖此模块获取 AI 能力，不经过 angineer-core 中转。

  - id: tree-core
    path: services/tree-core
    role: tree_operations_foundation
    depends_on: []
    key_symbols:
      - tree_store.py
      - tree_contracts.py
    description: >
      通用树操作基础设施，零外部依赖。提供树节点 CRUD、移动、排序归一化等操作。
      各服务在自己的 SQLite 中创建 tree_node 表，调用 tree_core 的函数操作。
      消除各服务（evals-core、docs-core 等）重复的树 CRUD 代码。

  - id: evals-core
    path: services/evals-core
    role: evaluation_engine
    depends_on:
      - tree-core
    key_symbols:
      - dataset/manager.py
      - storage/result_store.py
      - contracts.py

  - id: docs-core
    path: services/docs-core
    role: document_parse_and_knowledge
    depends_on:
      - ai-inference
      - tree-core
    key_symbols:
      - docs_service.py
      - mineru_parser.py
      - step09_query/protocols/contracts.py
      - step09_query/retrieval/dense_retriever.py
      - step09_query/retrieval/hybrid_retriever.py

  - id: angineer-core
    path: services/angineer-core
    role: agent_orchestration
    depends_on:
      - ai-inference
    key_symbols:
      - core/classifier.py
      - core/dispatcher.py
      - core/memory.py
    description: >
      意图识别与调度核心。依赖 ai-inference 获取 LLM 能力，
      但不再重导出 ai-inference 的符号。

  - id: engtools
    path: services/engtools
    role: engineering_tools
    depends_on:
      - ai-inference
    key_symbols:
      - KnowledgeTool.py
      - TableTool.py
      - ConditionalTool.py

  - id: sop-core
    path: services/sop-core
    role: sop_runtime
    depends_on:
      - ai-inference
    key_symbols:
      - sop_parser.py

  - id: geo-core
    path: services/geo-core
    role: geo_runtime
    depends_on: []

flows:
  - id: resource-open
    purpose: Open knowledge, project, and SOP resources through one frontend protocol.
    steps:
      - createResourceNode
      - createOpenResourcePayload
      - useResourceOpen.openResource
      - workbenchStore.openResource
      - Workbench view mapping
    anchors:
      - packages/docs-ui/src/composables/useResourceAdapter.ts
      - apps/web-console/src/composables/useResourceOpen.ts
      - apps/web-console/src/stores/workbench.ts

  - id: docs-runtime
    purpose: Parse one document into storage, index, and frontend-readable outputs.
    steps:
      - register_document
      - ParseOrchestrator.create_parse_task
      - mineru_parser.parse_document
      - result_store_json.save_markdown
      - result_store_json.save_parse_artifacts
      - build_structured_index_for_doc
      - GET /api/knowledge/document/{library_id}/{doc_id}
      - GET /api/knowledge/document/{library_id}/{doc_id}/structured
    anchors:
      - services/docs-api/docs_routes.py
      - services/docs-api/routes/v1/documents.py
      - services/docs-core/src/docs_core/step03_mineru_parse/mineru_parser.py
      - services/docs-core/src/docs_core/docs_file_io.py
      - services/docs-core/src/docs_core/docs_service.py

  - id: agent-chat-runtime
    purpose: Route one knowledge question through AgentSession, retrieval, and LLM generation.
    steps:
      - POST /api/chat/agent
      - AgentSession.run (angineer-core agent_loop)
      - IntentClassifier.classify_intent (angineer-core, uses ai-inference LLMClient)
      - knowledge retrieval tools (docs-core / engtools)
      - LLM generation (ai-inference LLMClient)
      - SSE AgentEvent frames (run_start / tool_start / note / answer / message_delta / run_end)
    anchors:
      - services/aichat-api/main.py
      - services/aichat-api/chat_agent.py
      - services/angineer-core/src/angineer_core/agent_loop.py
      - services/angineer-core/src/angineer_core/classifier.py
      - services/docs-core/src/docs_core/step09_query/protocols/contracts.py
      - services/docs-core/src/docs_core/retrieval/hybrid_retriever.py
      - services/ai-inference/src/ai_inference/llm_client.py

storage:
  document_root: data/knowledge_base/libraries/{library_id}/documents/{doc_id}
  databases:
    - data/knowledge_base/knowledge_meta.sqlite
    - data/knowledge_base/knowledge_index.sqlite
  expected_layout:
    - source/
    - parsed/
    - edited/
    - structured/

invariants:
  - user-web and admin-web should share the resource protocol by default.
  - frontend /api proxy splits by path: docs routes -> http://localhost:8790, chat/sops/evals/dream-cycle -> http://localhost:8791.
  - docs-api / aichat-api are the two service gateways; frontend requests always enter through the vite/nginx proxy.
  - docs parsing must remain asynchronous when work is long-running.
  - docs storage follows one-document-one-folder.
  - docs-core runtime data uses knowledge_meta.sqlite and knowledge_index.sqlite.
  - ai-inference is the sole AI inference provider with zero reverse dependencies.
  - tree-core is the sole tree operations provider with zero reverse dependencies.
  - all services needing LLM/semantic capabilities must import directly from ai_inference, not via angineer-core re-export.
  - all services needing tree operations must import directly from tree_core, not re-implement CRUD/move/normalize.

change_checklist:
  - If ports change, update every reference in docs and frontend proxy config in the same change.
  - If resource protocol changes, update adapter, open flow, workbench mapping, and both consoles.
  - If docs storage layout changes, update docs-core, engtools compatibility, docs, and migration path.
  - If knowledge routes change, update README and docs/ 模块文档。
  - If ai-inference API changes, update all direct consumers (angineer-core, docs-core, engtools, sop-core, docs-api, aichat-api).
  - If tree-core API changes, update all direct consumers (evals-core, docs-core).
