<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-dim{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
</style></defs>
<text class="t" x="18" y="24" font-size="15">之前写的是两类东西：产品代码 + 评测脚手架（harness）</text>

<rect class="box-warn" x="18" y="40" width="316" height="228" rx="8"/>
<text class="t" x="176" y="64" text-anchor="middle" font-size="13">① 产品代码（进了生产路径，默认关）</text>
<text class="t" x="34" y="90" font-size="12">conv_graph.py</text>
<text class="t-dim" x="34" y="108" font-size="12">写路径 + 读路径 + transformer</text>
<text class="t" x="34" y="132" font-size="12">graph_store.py</text>
<text class="t-dim" x="34" y="150" font-size="12">四表 + apply_ops + 五处级联</text>
<text class="t" x="34" y="174" font-size="12">sqlite_store.py 补丁</text>
<text class="t-dim" x="34" y="192" font-size="12">建表接入 + busy_timeout</text>
<text class="t" x="34" y="216" font-size="12">aichat-api 接线</text>
<text class="t-dim" x="34" y="234" font-size="12">attempt 包装 + run_end 异步蒸馏</text>
<text class="t-danger" x="34" y="256" font-size="12">→ 需改写（键/节点/边/用途）；指针骨架作废</text>

<rect class="box-ok" x="346" y="40" width="316" height="228" rx="8"/>
<text class="t" x="504" y="64" text-anchor="middle" font-size="13">② 评测脚手架 harness（本话写的大头）</text>
<text class="t" x="362" y="90" font-size="12">evals_core/blackboard/</text>
<text class="t-dim" x="362" y="108" font-size="12">cases / graph / arms / runner</text>
<text class="t" x="362" y="132" font-size="12">tests/ 四套</text>
<text class="t-dim" x="362" y="150" font-size="12">evals 16 + conv_graph 13 + store 9 + budget 39</text>
<text class="t" x="362" y="174" font-size="12">.dsh-scratch/m0_*</text>
<text class="t-dim" x="362" y="192" font-size="12">判分跑 / 盲序判分表 / 汇总 / 机制使用率</text>
<text class="t" x="362" y="216" font-size="12">冻结记录</text>
<text class="t-dim" x="362" y="234" font-size="12">21 题 + 指纹 + 基线 sha256</text>
<text class="t-ok" x="362" y="256" font-size="12">→ 基本全留：下一轮验证图 B，换指标即可复用</text>

<rect class="box-dim" x="18" y="284" width="644" height="94" rx="8"/>
<text class="t" x="340" y="308" text-anchor="middle" font-size="13">③ DSH harness（你现在用的这个 App 本身）</text>
<text class="t-ok" x="340" y="332" text-anchor="middle" font-size="12">改动 0 行 —— 全程只读它来查规范，没改它一行代码</text>
<text class="t-dim" x="340" y="356" text-anchor="middle" font-size="12">AnGIneer 仓库里的产品代码与评测脚手架，才是本话写的东西</text>
</svg>
