<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-danger{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.2}
.box-dim{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
.line{stroke:#94a3b8;stroke-width:1.4}
</style></defs>
<text class="t" x="18" y="24" font-size="15">按共享引擎看：钩子该在引擎层，不在 SSE 层</text>

<rect class="box-dim" x="18" y="40" width="200" height="70" rx="8"/>
<text class="t" x="118" y="64" text-anchor="middle" font-size="12">对话 API 入口</text>
<text class="t-dim" x="118" y="86" text-anchor="middle" font-size="12">真实会话 → 可写图</text>
<text class="t-dim" x="118" y="102" text-anchor="middle" font-size="12">（图 A 归此，图 B 也归此）</text>

<rect class="box-dim" x="462" y="40" width="200" height="70" rx="8"/>
<text class="t" x="562" y="64" text-anchor="middle" font-size="12">评测 runner 入口</text>
<text class="t-dim" x="562" y="86" text-anchor="middle" font-size="12">合成会话 → 只读、不写图</text>
<text class="t-dim" x="562" y="102" text-anchor="middle" font-size="12">（否则污染领域图）</text>

<rect class="box-ok" x="238" y="40" width="204" height="70" rx="8"/>
<text class="t" x="340" y="64" text-anchor="middle" font-size="12">引擎层（共享）</text>
<text class="t-ok" x="340" y="86" text-anchor="middle" font-size="12">钩子应在这里</text>
<text class="t-dim" x="340" y="102" text-anchor="middle" font-size="12">两个入口都过它</text>
<line class="line" x1="218" y1="75" x2="238" y2="75"/>
<line class="line" x1="462" y1="75" x2="442" y2="75"/>

<rect class="box" x="18" y="126" width="644" height="152" rx="8"/>
<text class="t" x="340" y="150" text-anchor="middle" font-size="13">按这个视角重审：保留清单</text>
<text class="t-ok" x="34" y="176" font-size="12">① 存储模式与五处级联（chat-history 层）—— 与入口无关，图 A/B 都要用</text>
<text class="t-dim" x="34" y="196" font-size="12">　 留：建表接入 + busy_timeout + 级联测试（当规格）；表结构按新 schema 重写</text>
<text class="t-ok" x="34" y="220" font-size="12">② 分层：图协议放引擎、存储实现在 chat-history（仓库既有范例 history_store）</text>
<text class="t-dim" x="34" y="240" font-size="12">　 留：这个分层本身；它保证两个入口都能用同一套图能力</text>
<text class="t-ok" x="34" y="264" font-size="12">③ 评测装置 —— 因为共享引擎，评测能测到对话层的一切</text>

<rect class="box-danger" x="18" y="290" width="644" height="80" rx="8"/>
<text class="t-danger" x="340" y="314" text-anchor="middle" font-size="13">建议回退（放错层或服务错假设）</text>
<text class="t" x="34" y="340" font-size="12">SSE 层挂钩：main.py 的 run_end 蒸馏 + chat_agent 的 attempt 包装（评测入口拿不到，等于只在对话层生效）</text>
<text class="t" x="34" y="360" font-size="12">prompt 注入那套 transformer + 臂 2 指针骨架（服务"模型缺锚点"这个被否掉的假设）</text>

<rect class="box" x="18" y="382" width="644" height="76" rx="8"/>
<text class="t" x="340" y="406" text-anchor="middle" font-size="13">这次重审新得的一条设计纪律</text>
<text class="t-dim" x="34" y="430" font-size="12">钩子只允许放引擎层，并按入口打标：对话入口可写图，评测入口只读 —— 否则评测会污染领域图</text>
<text class="t-dim" x="34" y="450" font-size="12">这条写进 BB 后，可避免下次再把功能挂到 SSE 分支上（我这次就是这么错的）</text>
</svg>
