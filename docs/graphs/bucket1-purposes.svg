<svg viewBox="0 0 680 512" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
</style></defs>
<text class="t" x="18" y="24" font-size="15">桶①里的六样，各自有什么用</text>
<text class="t-dim" x="18" y="46" font-size="12">名字</text>
<text class="t-dim" x="300" y="46" font-size="12">作用与复用点</text>

<rect class="box" x="18" y="54" width="644" height="64" rx="8"/>
<text class="t" x="32" y="82" font-size="12">评测脚手架</text>
<text class="t-dim" x="32" y="102" font-size="12">548 行</text>
<text class="t-dim" x="300" y="80" font-size="12">把「真实历史题 → 三臂组装 → 指标」自动化</text>
<text class="t-dim" x="300" y="100" font-size="12">换指标即可再测一次：以后改图不靠感觉，靠读数</text>

<rect class="box" x="18" y="126" width="644" height="64" rx="8"/>
<text class="t" x="32" y="154" font-size="12">四套测试</text>
<text class="t-dim" x="32" y="174" font-size="12">77 例</text>
<text class="t-dim" x="300" y="152" font-size="12">锁住「开关关态与现状逐字一致」这条铁律</text>
<text class="t-dim" x="300" y="172" font-size="12">动图代码时的安全网；也是「默认关可信」的依据</text>

<rect class="box" x="18" y="198" width="644" height="64" rx="8"/>
<text class="t" x="32" y="226" font-size="12">冻结记录</text>
<text class="t-dim" x="32" y="246" font-size="12">21 题 + 指纹</text>
<text class="t-dim" x="300" y="224" font-size="12">预注册证据链：实验前锁题集、锁基线，事后不可改</text>
<text class="t-dim" x="300" y="244" font-size="12">以后任何对外结论都要挂它，否则数字无根</text>

<rect class="box box-ok" x="18" y="270" width="644" height="64" rx="8"/>
<text class="t" x="32" y="298" font-size="12">图 A 数据提取</text>
<text class="t-dim" x="32" y="318" font-size="12">约 80 行</text>
<text class="t-dim" x="300" y="296" font-size="12">就是 Tab① 轨迹抽屉的数据源：轮次 → 真正引用了哪些条款</text>
<text class="t-dim" x="300" y="316" font-size="12">含两个坑的解法：落库 meta 被裁（items 从 content 解）、join 口径</text>

<rect class="box box-ok" x="18" y="342" width="644" height="64" rx="8"/>
<text class="t" x="32" y="370" font-size="12">建表幂等 + 五处级联</text>
<text class="t-dim" x="32" y="390" font-size="12">约 150 行</text>
<text class="t-dim" x="300" y="368" font-size="12">删会话 / 删库 / 游客认领 / GC / 库拆合 五处都要连带清图</text>
<text class="t-dim" x="300" y="388" font-size="12">领域图同样要这套：长期资产必须解决生命周期与清理</text>

<rect class="box box-ok" x="18" y="414" width="644" height="64" rx="8"/>
<text class="t" x="32" y="442" font-size="12">run_end 异步挂点</text>
<text class="t-dim" x="32" y="462" font-size="12">约 40 行</text>
<text class="t-dim" x="300" y="440" font-size="12">会话一结束就送蒸馏，不阻塞回答；失败只告警</text>
<text class="t-dim" x="300" y="460" font-size="12">改成「写领域图」后，挂点位置与限流纪律不用重找</text>

<rect class="box" x="18" y="486" width="644" height="22" rx="6"/>
<text class="t-ok" x="340" y="502" text-anchor="middle" font-size="12">共同点：它们不是功能，是基础设施 + 证据 + 安全网 —— 换方向后一个都不用变</text>
</svg>
