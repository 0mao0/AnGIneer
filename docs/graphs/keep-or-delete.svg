<svg viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
.box-danger{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.2}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
</style></defs>
<text class="t" x="18" y="24" font-size="15">这些代码留不留：分三桶处理</text>

<rect class="box-ok" x="18" y="40" width="206" height="240" rx="8"/>
<text class="t-ok" x="121" y="64" text-anchor="middle" font-size="13">① 留（约 750 行）</text>
<text class="t" x="32" y="90" font-size="12">评测脚手架</text>
<text class="t-dim" x="32" y="108" font-size="12">harness 548 + 四套测试</text>
<text class="t" x="32" y="132" font-size="12">冻结记录</text>
<text class="t-dim" x="32" y="150" font-size="12">21 题 + 指纹 + 基线 sha256</text>
<text class="t" x="32" y="174" font-size="12">图 A 数据提取</text>
<text class="t-dim" x="32" y="192" font-size="12">轮次 → 真正引用的条款</text>
<text class="t" x="32" y="216" font-size="12">建表幂等 + 五处级联</text>
<text class="t-dim" x="32" y="234" font-size="12">领域图同样要用</text>
<text class="t" x="32" y="258" font-size="12">run_end 异步挂点</text>
<text class="t-dim" x="32" y="276" font-size="12">线程池 1 + 失败降级</text>

<rect class="box-warn" x="237" y="40" width="206" height="240" rx="8"/>
<text class="t" x="340" y="64" text-anchor="middle" font-size="13">② 留但标注"方向已废"（约 400 行）</text>
<text class="t" x="251" y="90" font-size="12">conv_graph 召回/渲染</text>
<text class="t-dim" x="251" y="108" font-size="12">图 B 会重写，可作参考</text>
<text class="t" x="251" y="132" font-size="12">四处挂钩</text>
<text class="t-dim" x="251" y="150" font-size="12">建表 / 蒸馏 / 装配</text>
<text class="t" x="251" y="174" font-size="12">HTML 剥离 / key 截断</text>
<text class="t-dim" x="251" y="192" font-size="12">图 B 节点名同样要用</text>
<text class="t" x="251" y="216" font-size="12">为什么不删</text>
<text class="t-dim" x="251" y="234" font-size="12">默认关＝零运行风险</text>
<text class="t-dim" x="251" y="258" font-size="12">删除要回归，收益只有几百行</text>
<text class="t-dim" x="251" y="276" font-size="12">改键那一轮顺手清更划算</text>

<rect class="box-danger" x="456" y="40" width="206" height="240" rx="8"/>
<text class="t-danger" x="559" y="64" text-anchor="middle" font-size="13">③ 建议删（约 270 行）</text>
<text class="t" x="470" y="90" font-size="12">子图段注入 transformer</text>
<text class="t-dim" x="470" y="108" font-size="12">把图塞进 prompt 那一套</text>
<text class="t-dim" x="470" y="128" font-size="12">实测使用率 3~5%</text>
<text class="t" x="470" y="156" font-size="12">臂 2 指针骨架</text>
<text class="t-dim" x="470" y="174" font-size="12">压缩行尾加指针</text>
<text class="t-dim" x="470" y="194" font-size="12">服务的是被否掉的假设</text>
<text class="t" x="470" y="222" font-size="12">什么时候删</text>
<text class="t-dim" x="470" y="240" font-size="12">改键那一轮顺手删</text>
<text class="t-dim" x="470" y="260" font-size="12">不必现在单独开一轮</text>
<text class="t-dim" x="470" y="280" font-size="12">（要现在删：约 30 分钟 + 重跑测试）</text>

<rect class="box" x="18" y="296" width="644" height="112" rx="8"/>
<text class="t" x="340" y="320" text-anchor="middle" font-size="13">三个必须先做的事（比"删代码"重要）</text>
<text class="t" x="34" y="346" font-size="12">① 在 BB 与代码注释里写死：这些是错方向的产物，不得作为后续基础（防后人照抄）</text>
<text class="t" x="34" y="368" font-size="12">② 把 .dsh-scratch 里的 m0_* 脚本搬进 scripts/（现在在 gitignored 目录，会丢）</text>
<text class="t" x="34" y="390" font-size="12">③ 保留默认关；发版前确认服务器 .env 里三个开关都没打开</text>
</svg>
