<svg viewBox="0 0 680 412" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
.box-danger{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.2}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
</style></defs>
<text class="t" x="18" y="24" font-size="15">已写代码盘点：能留 / 要改 / 作废</text>

<rect class="box-ok" x="18" y="40" width="206" height="212" rx="8"/>
<text class="t-ok" x="121" y="64" text-anchor="middle" font-size="13">可直接复用 ≈35%</text>
<text class="t" x="32" y="90" font-size="12">图 A 的数据提取</text>
<text class="t-dim" x="32" y="108" font-size="12">轮次 → 真正引用的条款</text>
<text class="t" x="32" y="132" font-size="12">建表 / 幂等 / 级联模板</text>
<text class="t-dim" x="32" y="150" font-size="12">四表 + 五处级联已验证</text>
<text class="t" x="32" y="174" font-size="12">run_end 异步蒸馏挂点</text>
<text class="t-dim" x="32" y="192" font-size="12">线程池 1 + 降级</text>
<text class="t" x="32" y="216" font-size="12">HTML 剥离 / key 截断</text>
<text class="t-dim" x="32" y="234" font-size="12">图 B 的节点名同样要用</text>

<rect class="box-warn" x="237" y="40" width="206" height="212" rx="8"/>
<text class="t" x="340" y="64" text-anchor="middle" font-size="13">需改写 ≈40%</text>
<text class="t" x="251" y="90" font-size="12">键模型</text>
<text class="t-dim" x="251" y="108" font-size="12">(owner, session) → (库/领域)</text>
<text class="t" x="251" y="132" font-size="12">节点类型</text>
<text class="t-dim" x="251" y="150" font-size="12">加业务要素与关系</text>
<text class="t" x="251" y="174" font-size="12">边类型</text>
<text class="t-dim" x="251" y="192" font-size="12">溯源边 → 计算关系边</text>
<text class="t" x="251" y="216" font-size="12">用途</text>
<text class="t-dim" x="251" y="234" font-size="12">注入 prompt → 可视化资产</text>

<rect class="box-danger" x="456" y="40" width="206" height="212" rx="8"/>
<text class="t-danger" x="559" y="64" text-anchor="middle" font-size="13">基本作废 ≈25%</text>
<text class="t" x="470" y="90" font-size="12">臂 2 指针骨架</text>
<text class="t-dim" x="470" y="108" font-size="12">压缩行尾加指针</text>
<text class="t" x="470" y="132" font-size="12">子图段注入 transformer</text>
<text class="t-dim" x="470" y="150" font-size="12">模型使用率仅 3~5%</text>
<text class="t" x="470" y="174" font-size="12">M0 判分表与批跑产物</text>
<text class="t-dim" x="470" y="192" font-size="12">保留为证据，不进气品</text>
<text class="t" x="470" y="216" font-size="12">但方法学骨架可留</text>
<text class="t-dim" x="470" y="234" font-size="12">真实题集 + 三臂对比</text>

<rect class="box" x="18" y="268" width="644" height="124" rx="8"/>
<text class="t" x="340" y="294" text-anchor="middle" font-size="13">真正值钱的是判据（不是代码）</text>
<text class="t-dim" x="34" y="320" font-size="12">① 压缩历史只省 3.5% prompt token → 「压缩」不是主战场</text>
<text class="t-dim" x="34" y="342" font-size="12">② 注入指针 / 子图段被答案引用只有 3~5% → 旧路线不成立</text>
<text class="t-dim" x="34" y="364" font-size="12">③ 采样噪声大于机制效应（同题三臂 899/3070/47 字）→ 单轮对比不足为凭</text>
<text class="t-ok" x="34" y="384" font-size="12">这三条直接省掉了「继续在注入方向投入」的时间和预算</text>
</svg>
