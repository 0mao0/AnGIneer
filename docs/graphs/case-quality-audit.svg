<svg viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
.box-danger{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.2}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
</style></defs>
<text class="t" x="18" y="24" font-size="15">21 题的真实成色（题面逐字复制，但挑题没筛质量）</text>

<rect class="box-ok" x="18" y="40" width="206" height="188" rx="8"/>
<text class="t-ok" x="121" y="64" text-anchor="middle" font-size="13">像样的能力题 9 题</text>
<text class="t" x="32" y="90" font-size="12">A2 安全系数取值</text>
<text class="t" x="32" y="110" font-size="12">A3 抗倾稳定（承接）</text>
<text class="t" x="32" y="130" font-size="12">A4 第4题重讲</text>
<text class="t" x="32" y="150" font-size="12">B1 / B2 / B3 / B4 计算</text>
<text class="t" x="32" y="170" font-size="12">C1 / C5 条款回引</text>
<text class="t-dim" x="32" y="196" font-size="12">共同点：有参数、有对错、</text>
<text class="t-dim" x="32" y="214" font-size="12">能写出判定依据</text>

<rect class="box-warn" x="237" y="40" width="206" height="188" rx="8"/>
<text class="t" x="340" y="64" text-anchor="middle" font-size="13">偏弱 / 含糊 5 题</text>
<text class="t" x="251" y="90" font-size="12">A6 支座病害展开</text>
<text class="t" x="251" y="110" font-size="12">C2 乘潮累积频率统计</text>
<text class="t" x="251" y="130" font-size="12">C3 / C4 使用年限</text>
<text class="t" x="251" y="150" font-size="12">D3 混凝土标号</text>
<text class="t-dim" x="251" y="176" font-size="12">问题不算错，但检索证据薄、</text>
<text class="t-dim" x="251" y="194" font-size="12">答案好坏主观性强</text>
<text class="t-dim" x="251" y="214" font-size="12">（实测多题基线直接拒答）</text>

<rect class="box-danger" x="456" y="40" width="206" height="188" rx="8"/>
<text class="t-danger" x="559" y="64" text-anchor="middle" font-size="13">元问题 / 调试 / 歧义 5 题</text>
<text class="t" x="470" y="90" font-size="12">A5 刚才第二个问题说了什么</text>
<text class="t" x="470" y="110" font-size="12">A7 为什么没有引用 [K6][K7]</text>
<text class="t" x="470" y="130" font-size="12">A1 刚才第二条（链尾是「你好」）</text>
<text class="t" x="470" y="150" font-size="12">D1 具体差多少（指涉不明）</text>
<text class="t" x="470" y="170" font-size="12">D2 内河与外海有区别么（含糊）</text>
<text class="t-dim" x="470" y="196" font-size="12">A7 是调试引用标记的</text>
<text class="t-dim" x="470" y="214" font-size="12">A5 是机制自检</text>

<rect class="box" x="18" y="240" width="644" height="98" rx="8"/>
<text class="t" x="340" y="264" text-anchor="middle" font-size="13">另外两题是对照题（C6 / D4，单轮无链）——共 21 题</text>
<text class="t-dim" x="34" y="290" font-size="12">题面：逐字来自 chat.sqlite（(session_id, seq) 处 user 原文）—— 有单测逐题校验，没改一个字</text>
<text class="t-dim" x="34" y="312" font-size="12">但铺垫轮是各臂重新生成的（所以你看到的「答案都改了」是必然）</text>
<text class="t-dim" x="34" y="332" font-size="12">链里还混着寒暄与碎片轮：你好 / 好的 / 想知道的 / 想的 / 在么</text>

<rect class="box" x="18" y="350" width="644" height="90" rx="8"/>
<text class="t" x="34" y="374" font-size="13">后果与该做的修正</text>
<text class="t" x="34" y="398" font-size="12">① 「注入使用率 3~5%」这条结论要打折：样本本身成色差，不能代表真实业务</text>
<text class="t" x="34" y="420" font-size="12">② 重新抽样：随机 + 分层（按会话类型），只从「有参数、有对错」的轮次取题</text>
<text class="t" x="34" y="440" font-size="12">③ 抽样规则写进预注册，题集入库走 dataset schema（不再手写在 cases.py）</text>
</svg>
