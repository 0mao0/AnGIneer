<svg viewBox="0 0 680 258" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.line{stroke:#94a3b8;stroke-width:1.4}
</style></defs>
<text class="t" x="18" y="26" font-size="15">两张图必须能互相跳（否则只是两个孤立展示页）</text>
<rect class="box" x="18" y="64" width="264" height="104" rx="8"/>
<text class="t" x="150" y="90" text-anchor="middle" font-size="13">图 A・会话轨迹（聊天页）</text>
<text class="t-dim" x="150" y="114" text-anchor="middle" font-size="12">轮次节点 + 主题聚合（会话节点）</text>
<text class="t-dim" x="150" y="134" text-anchor="middle" font-size="12">每轮引用了哪些条款</text>
<text class="t-dim" x="150" y="154" text-anchor="middle" font-size="12">随会话存在、随会话生成</text>
<rect class="box" x="398" y="64" width="264" height="104" rx="8"/>
<text class="t" x="530" y="90" text-anchor="middle" font-size="13">图 B・领域图（知识库）</text>
<text class="t-dim" x="530" y="114" text-anchor="middle" font-size="12">要素 + 计算关系 + 公式</text>
<text class="t-dim" x="530" y="134" text-anchor="middle" font-size="12">跨会话累积、带版本</text>
<text class="t-dim" x="530" y="154" text-anchor="middle" font-size="12">草稿 → 审阅 → 发布</text>
<line class="line" x1="282" y1="94" x2="398" y2="94"/>
<text class="t-dim" x="340" y="86" text-anchor="middle" font-size="12">本轮贡献了哪些节点</text>
<line class="line" x1="398" y1="142" x2="282" y2="142"/>
<text class="t-dim" x="340" y="134" text-anchor="middle" font-size="12">这个节点由哪些会话</text>
<text class="t-dim" x="340" y="152" text-anchor="middle" font-size="12">（哪一轮）贡献</text>
<rect class="box" x="18" y="186" width="644" height="54" rx="8"/>
<text class="t" x="340" y="210" text-anchor="middle" font-size="13">实现靠一张反向索引：领域节点 → 来源会话与轮次</text>
<text class="t-dim" x="340" y="231" text-anchor="middle" font-size="12">没有它，图 B 点不回图 A，两张图就废一半</text>
</svg>
