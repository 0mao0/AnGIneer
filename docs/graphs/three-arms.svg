<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}
.box-ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.2}
.box-warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
.box-danger{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.2}
.layer{fill:#eef2f7;stroke:#cbd5e1;stroke-width:1}
.t{fill:#1f2937}
.t-dim{fill:#64748b}
.t-ok{fill:#059669}
.t-danger{fill:#dc2626}
</style></defs>
<text class="t" x="18" y="24" font-size="15">三臂＝同一段历史，三种 prompt 装配</text>

<rect class="box" x="18" y="38" width="206" height="196" rx="8"/>
<text class="t" x="121" y="60" text-anchor="middle" font-size="13">臂 1・现状（A-min）</text>
<rect class="layer" x="32" y="70" width="178" height="26" rx="5"/>
<text class="t-dim" x="121" y="88" text-anchor="middle" font-size="12">系统提示</text>
<rect class="layer" x="32" y="102" width="178" height="26" rx="5"/>
<text class="t-dim" x="121" y="120" text-anchor="middle" font-size="12">语义史（逐字）</text>
<rect class="layer" x="32" y="134" width="178" height="40" rx="5"/>
<text class="t-dim" x="121" y="152" text-anchor="middle" font-size="12">历史 tool 段</text>
<text class="t-dim" x="121" y="168" text-anchor="middle" font-size="12">（预算闸压成摘要）</text>
<rect class="layer" x="32" y="180" width="178" height="26" rx="5"/>
<text class="t-dim" x="121" y="198" text-anchor="middle" font-size="12">本轮提问</text>
<text class="t-dim" x="121" y="224" text-anchor="middle" font-size="12">＝生产现状（开关关）</text>

<rect class="box-warn" x="237" y="38" width="206" height="196" rx="8"/>
<text class="t" x="340" y="60" text-anchor="middle" font-size="13">臂 2・指针骨架</text>
<rect class="layer" x="251" y="70" width="178" height="26" rx="5"/>
<text class="t-dim" x="340" y="88" text-anchor="middle" font-size="12">系统提示</text>
<rect class="layer" x="251" y="102" width="178" height="26" rx="5"/>
<text class="t-dim" x="340" y="120" text-anchor="middle" font-size="12">语义史（逐字）</text>
<rect class="layer" x="251" y="134" width="178" height="40" rx="5"/>
<text class="t-dim" x="340" y="152" text-anchor="middle" font-size="12">历史 tool 段 ＋</text>
<text class="t-dim" x="340" y="168" text-anchor="middle" font-size="12">候选指针 K1,K12=文档/章节</text>
<rect class="layer" x="251" y="180" width="178" height="26" rx="5"/>
<text class="t-dim" x="340" y="198" text-anchor="middle" font-size="12">本轮提问</text>
<text class="t-dim" x="340" y="224" text-anchor="middle" font-size="12">开关 ANGINEER_POINTER_SKELETON</text>

<rect class="box-ok" x="456" y="38" width="206" height="196" rx="8"/>
<text class="t" x="559" y="60" text-anchor="middle" font-size="13">臂 3・会话图</text>
<rect class="layer" x="470" y="70" width="178" height="26" rx="5"/>
<text class="t-dim" x="559" y="88" text-anchor="middle" font-size="12">系统提示</text>
<rect class="layer" x="470" y="102" width="178" height="26" rx="5"/>
<text class="t-dim" x="559" y="120" text-anchor="middle" font-size="12">语义史（逐字）</text>
<rect class="layer" x="470" y="134" width="178" height="40" rx="5"/>
<text class="t-danger" x="559" y="152" text-anchor="middle" font-size="12">历史 tool 原文移出</text>
<text class="t-ok" x="559" y="168" text-anchor="middle" font-size="12">换成「相关子图段」</text>
<rect class="layer" x="470" y="180" width="178" height="26" rx="5"/>
<text class="t-dim" x="559" y="198" text-anchor="middle" font-size="12">本轮提问</text>
<text class="t-dim" x="559" y="224" text-anchor="middle" font-size="12">开关 ANGINEER_CONV_GRAPH</text>

<rect class="box" x="18" y="248" width="644" height="168" rx="8"/>
<text class="t" x="340" y="272" text-anchor="middle" font-size="13">为什么要三条臂，而不是两条</text>
<text class="t" x="34" y="298" font-size="12">臂 2 − 臂 1 ＝ 只给「锚点（指针）」值多少</text>
<text class="t" x="34" y="320" font-size="12">臂 3 − 臂 2 ＝ 在锚点之上再加「图」多值多少 ← 预注册的核心指标</text>
<text class="t" x="34" y="342" font-size="12">若只有两条（现状 vs 图），分不清是哪一味起作用</text>
<text class="t-danger" x="34" y="368" font-size="12">实测结果：臂 2 的指针被答案引用仅 3~5% → 这两条臂都在服务一个被否掉的假设</text>
<text class="t-dim" x="34" y="392" font-size="12">arms.py 本身（装配与分段读数）是 harness，可留；换指标即可用于图 A / 图 B</text>
</svg>
