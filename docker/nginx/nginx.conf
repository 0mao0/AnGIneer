worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Docker 内嵌 DNS：proxy_pass 带变量时按 valid TTL 重解析后端 service 名——
    # 2026-09-18 实踩：upstream 块只在 nginx 启动时解析一次，部署重建 aichat-api 容器换 IP 后
    # 前端 nginx 持旧 IP，全站 /api/chat 502 直到手工重启 frontend 容器
    resolver 127.0.0.11 valid=15s;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        location / {
            root /usr/share/nginx/html/web;
            index index.html;
            try_files $uri $uri/ /index.html;
            # SPA 入口必须每次校验收口（vite 产物是哈希资产，旧 index.html 会把浏览器
            # 钉在老 JS 上——2026-09-18 实踩：退出刷新等修复部署后仍跑旧包）。
            # no-cache = 每次协商（304 便宜），不是 no-store（允许 304 缓存生效）
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ~ ^/api/api-keys {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/users {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 大 PDF 预览：不缓冲，避免 nginx 落临时文件，客户端断开也能及时取消上游读取
        location ^~ /api/files {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/chat {
            set $aichat_upstream "http://aichat-api:8791";
            proxy_pass $aichat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        location ~ ^/api/(sops|evals|dream-cycle|llm_configs) {
            set $aichat_upstream "http://aichat-api:8791";
            proxy_pass $aichat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /webhook/ {
            proxy_pass http://172.17.0.1:9000/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location /docs {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/redoc;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
