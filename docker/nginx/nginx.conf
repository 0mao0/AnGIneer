worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Docker 内嵌 DNS：proxy_pass 带变量时按 valid TTL 重解析后端 service 名——
    # 2026-09-18 实踩：upstream 块只在 nginx 启动时解析一次，部署重建 aichat-api 容器换 IP 后
    # 前端 nginx 持旧 IP，全站 /api/chat 502 直到手工重启 frontend 容器
    resolver 127.0.0.11 valid=15s;

    # 公开页投稿频控（设计 R5 主防线）：按来源 IP 计，清 cookie/换游客桶绕不掉；
    # 应用层 COMMUNITY_DAILY_LIMIT 只是兜底（见 services/community/README.md）
    limit_req_zone $binary_remote_addr zone=community_submit:1m rate=6r/m;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        location / {
            root /usr/share/nginx/html/web;
            index index.html;
            try_files $uri $uri/ /index.html;
            # SPA 入口必须每次校验收口（vite 产物是哈希资产，旧 index.html 会把浏览器
            # 钉在老 JS 上——2026-09-18 实踩：退出刷新等修复部署后仍跑旧包）。
            # no-cache = 每次协商（304 便宜），不是 no-store（允许 304 缓存生效）
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ~ ^/api/api-keys {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/users {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 大 PDF 预览：不缓冲，避免 nginx 落临时文件，客户端断开也能及时取消上游读取
        location ^~ /api/files {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 语料包导入：GB 级 multipart 直传 docs-api，不落 nginx 临时文件、不设 200M 上限
        location ^~ /api/knowledge/imports/ {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/chat {
            set $aichat_upstream "http://aichat-api:8791";
            proxy_pass $aichat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # 公开页投稿写口频控（设计 §7.4/R5）：超 rate+burst 直接 503，不打到后端
        location = /api/community/submissions {
            limit_req zone=community_submit burst=5 nodelay;
            set $aichat_upstream "http://aichat-api:8791";
            proxy_pass $aichat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # L4 两写端点公网封锁（审计 2026-10-13）：唯一现役调用方是 aichat 装配层，
        # 走 compose 内网直连 http://sop-api:8792、不经本线；匿名可达=可刷 LLM 成本/刷 draft。
        # ^~ 前缀匹配抑制下方正则，含尾斜杠变体一并拦下。
        location ^~ /api/sops/synthesize  { return 403; }
        location ^~ /api/sops/crystallize { return 403; }

        # docs-api internal 面公网封锁（审计 2026-10-15）：调用方全走 compose 内网
        # http://docs-api:8790 不经本线；匿名可达=engtool-run 可执行工具+全套 engine 端口白嫖。
        location ^~ /api/knowledge/internal/ { return 403; }

        # SOP 数据面独立服务（v0.2.97 解耦）；必须声明在 aichat 组正则之前（首个匹配胜出）
        location ~ ^/api/sops {
            set $sop_upstream "http://sop-api:8792";
            proxy_pass $sop_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/(community|evals|dream-cycle|llm_configs) {
            set $aichat_upstream "http://aichat-api:8791";
            proxy_pass $aichat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /webhook/ {
            proxy_pass http://172.17.0.1:9000/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location /docs {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/redoc;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api_upstream "http://docs-api:8790";
            proxy_pass $api_upstream/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
