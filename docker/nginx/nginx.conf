worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 管理端访问白名单（公网部署时只允许内网/固定管理 IP 访问管理台与 key 管理接口）
    # 上线前把管理出口 IP 加入白名单；若部署在云服务器，建议用 VPN/堡垒机 IP 而非放通整个私网段
    geo $admin_allowed {
        default 0;
        127.0.0.1 1;
        ::1 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
    }

    upstream api_server {
        server docs-api:8790;
    }

    upstream aichat_api {
        server aichat-api:8791;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        location / {
            root /usr/share/nginx/html/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /admin/ {
            if ($admin_allowed = 0) { return 403; }
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # API Key 管理接口仅限内网访问，禁止公网直接调用
        location ~ ^/api/api-keys {
            if ($admin_allowed = 0) { return 403; }
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/chat {
            proxy_pass http://aichat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        location ~ ^/api/(sops|evals|dream-cycle|llm_configs) {
            proxy_pass http://aichat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /webhook/ {
            proxy_pass http://172.17.0.1:9000/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location /docs {
            if ($admin_allowed = 0) { return 403; }
            proxy_pass http://api_server/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            if ($admin_allowed = 0) { return 403; }
            proxy_pass http://api_server/redoc;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            if ($admin_allowed = 0) { return 403; }
            proxy_pass http://api_server/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
