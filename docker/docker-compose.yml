services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: angineer-frontend:latest
    container_name: angineer-frontend
    ports:
      # 外部入口：宿主机 AI 网关 nginx（80）反代到本端口；禁止前端直接占用 80
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - docs-api
      - aichat-api
    restart: unless-stopped
    networks:
      - angineer-net

  docs-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: angineer-docs-api:latest
    container_name: angineer-docs-api
    ports:
      # 只绑定本机回环，禁止从宿主机外部直接访问后端；nginx 容器仍可通过内网访问
      - "127.0.0.1:8790:8790"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8790"]
    working_dir: /app/services/docs-api
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    networks:
      - angineer-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8790/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  aichat-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: angineer-aichat-api:latest
    container_name: angineer-aichat-api
    ports:
      # 只绑定本机回环，禁止从宿主机外部直接访问后端
      - "127.0.0.1:8791:8791"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8791"]
    working_dir: /app/services/aichat-api
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    networks:
      - angineer-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8791/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  documentserver:
    image: onlyoffice/documentserver:latest
    container_name: angineer-onlyoffice
    ports:
      # ONLYOFFICE 文档服务器（浏览器直接访问，JWT 保护）
      - "8089:80"
    env_file:
      - ../.env
    environment:
      - EXAMPLE_ENABLED=true
      - JWT_ENABLED=true
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - SECURE_LINK_SECRET=kFyvDX4cprs52hu49xJj
    volumes:
      - ../data/onlyoffice/logs:/var/log/onlyoffice
      - ../data/onlyoffice/data:/var/www/onlyoffice/Data
      - ../data/onlyoffice/cache:/var/lib/onlyoffice/documentserver/App_Data/cache
      - ../data/onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json
      - ../data/onlyoffice/example-production-linux.json:/etc/onlyoffice/documentserver-example/production-linux.json
      - ../data/onlyoffice/example-local.json:/etc/onlyoffice/documentserver-example/local.json
    restart: unless-stopped
    networks:
      - angineer-net

networks:
  angineer-net:
    driver: bridge
