[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-ai-inference"
version = "0.1.1"
description = "AnGIneer AI inference client library (LLM multi-model routing, retry, circuit breaker, streaming)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/0mao0/angineer-ai-inference"
