[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-docs-api"
version = "0.2.5"
description = "AnGIneer 知识库/解析 HTTP 网关（仅依赖声明；代码以目录方式由 uvicorn 运行）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools]
py-modules = []
