[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-chat-history"
version = "0.1.0"
description = "AnGIneer chat history：HistoryStore 的 sqlite 实现 + 会话管理 FastAPI 路由"
requires-python = ">=3.10"
dependencies = [
    "angineer-core",
    "angineer-shared",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
