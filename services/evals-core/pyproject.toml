[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-evals-core"
version = "0.1.0"
description = "AnGIneer evaluation engine"
requires-python = ">=3.10"
dependencies = [
    "angineer-ai-inference",
    "angineer-core",
    "angineer-shared",
    "angineer-tree-core",
    "pydantic>=2.0.0",
    "deepeval>=4.0.0",
]

# 结构层解析评测（parse_struct）的依赖：只在开发机跑评测时需要，不进 nightly 运行环境。
# apted=表格 TEDS 的树编辑距离；Levenshtein=块文本编辑距离（缺失时退化为 difflib 近似）；
# lxml/tqdm=vendored 官方 TEDS 自带。安装：pip install -e "services/evals-core[parse-eval]"
[project.optional-dependencies]
parse-eval = [
    "apted>=1.0.3",
    "Levenshtein>=0.23",
    "lxml>=4.9",
    "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
