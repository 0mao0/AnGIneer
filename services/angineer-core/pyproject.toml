[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-core"
version = "0.1.4"
description = "AnGIneer core service - AI Engineer Operating System Core Module"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AnGIneer Team"}
]
keywords = ["ai", "agent", "sop", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "angineer-ai-inference>=0.2.2,<0.3.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# [server] 独立宿主壳（chat-api）：fastapi/uvicorn 只随本 extra 安装，纯库消费者不变重。
# 入口 angineer_core.server:app（uvicorn 直起，见包内 README / docs）。
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "fastapi>=0.115",  # server 壳测试（TestClient）
    "httpx>=0.27",     # fastapi TestClient 传输层
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
angineer_core = ["domain_packs/*.json"]

[project.urls]
Repository = "https://github.com/0mao0/angineer-core"
Issues = "https://github.com/0mao0/angineer-core/issues"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
