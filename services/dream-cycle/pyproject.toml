[project]
name = "angineer-dream-cycle"
version = "0.1.0"
description = "AnGIneer Dream Cycle - nightly knowledge base maintenance and health checks"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
