[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angineer-sop-core"
version = "0.1.0"
description = "AnGIneer SOP authoring library: loader/parser/validator/path generator (execution lives in angineer-core)"
requires-python = ">=3.10"
dependencies = [
    "angineer-ai-inference>=0.2.2",
    "angineer-core>=0.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
